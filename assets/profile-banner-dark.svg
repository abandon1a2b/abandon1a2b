    <text class="heading" x="24" y="78" font-size="40" font-weight="700" letter-spacing="-1">abandon1a2b</text>
    <path d="M26 87 Q107 93 183 87" fill="none" stroke="#c5d6b8" stroke-width="4" stroke-linecap="round"/>
    <text class="muted" x="26" y="119" font-size="16">Building ideas, one commit at a time.</text>
    <text class="accent" x="26" y="143" font-size="10" font-weight="600" letter-spacing="1.4">CODE A LITTLE. LEARN A LITTLE.</text>
  </g>

