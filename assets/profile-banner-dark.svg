<svg xmlns="http://www.w3.org/2000/svg" width="960" height="164" viewBox="0 0 960 164" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm abandon1a2b</title>
  <desc id="desc">A compact, soft sage banner with a curious goose at a laptop. Building ideas, one commit at a time.</desc>
  <style>
    .surface { fill: #1d2520; stroke: #303c33; }
    .heading { fill: #e5ede1; }
    .muted { fill: #a8b6a5; }
    .accent { fill: #a3c59a; }
    .wash { fill: #2b3a2d; }
    .trail { stroke: #566c51; }
    .goose { animation: bob 4s ease-in-out infinite; }
    .spark { animation: twinkle 4s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes twinkle { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .goose, .spark { animation: none; } }
  </style>

  <rect class="surface" x=".5" y=".5" width="959" height="163" rx="12"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
